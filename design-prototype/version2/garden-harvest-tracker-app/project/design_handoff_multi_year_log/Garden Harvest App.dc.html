<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=DM+Serif+Display&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#e9e6de;font-family:'Nunito Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
  .phone{width:390px;height:844px;background:#0c0c0d;border-radius:54px;padding:13px;box-shadow:0 34px 80px -24px rgba(20,30,15,.5),0 0 0 2px rgba(0,0,0,.55);position:relative;flex:0 0 auto}
  .phone-screen{width:100%;height:100%;border-radius:42px;overflow:hidden;position:relative;background:#000}
  .notch{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:118px;height:30px;background:#0c0c0d;border-radius:0 0 19px 19px;z-index:30}
</style>
</helmet>
<div class="stage">
  <div class="phone"><div class="notch"></div><div class="phone-screen">
    <dc-import name="GardenPhone" app="{{ app }}" theme="{{ theme }}" colors="{{ colors }}" variants="{{ variants }}" master="{{ master }}" season="{{ season }}" last-year-total="{{ lastYearTotal }}" on-select="{{ h.onSelect }}" on-nav="{{ h.onNav }}" on-key="{{ h.onKey }}" on-bump="{{ h.onBump }}" on-note="{{ h.onNote }}" on-date="{{ h.onDate }}" on-photo="{{ h.onPhoto }}" on-variant="{{ h.onVariant }}" on-save="{{ h.onSave }}" on-back="{{ h.onBack }}" on-start-add="{{ h.onStartAdd }}" on-add-name="{{ h.onAddName }}" on-pick-suggest="{{ h.onPickSuggest }}" on-toggle-quick="{{ h.onToggleQuick }}" on-commit-add="{{ h.onCommitAdd }}" on-share="{{ h.onShare }}" on-log-year="{{ h.onLogYear }}" on-log-crop="{{ h.onLogCrop }}" on-open-crop-sheet="{{ h.onOpenCropSheet }}" on-close-crop-sheet="{{ h.onCloseCropSheet }}" on-toggle-month="{{ h.onToggleMonth }}" hint-size="100%,100%" style="width:100%;height:100%"></dc-import>
  </div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  COLORS = { Asparagus:'#5a9a3d', Strawberries:'#e8434a', Raspberries:'#c02f66', Blueberries:'#3f6ad0', Boysenberries:'#6f3fa8', Artichoke:'#7f9a4e', Radishes:'#e05583', Peas:'#8cbf4f', Mushrooms:'#b08a63', 'Tomatoes Cherry':'#ef4f34' };
  QUICK = ['Asparagus','Strawberries','Raspberries','Blueberries','Boysenberries','Artichoke','Peas','Radishes'];
  VARIANTS = { Raspberries:['small','large'] };
  MASTER = ['Asparagus','Strawberries','Raspberries','Blueberries','Boysenberries','Blackberries','Artichoke','Radishes','Peas','Mushrooms','Tomatoes Cherry','Tomatoes','Cucumber','Zucchini','Kale','Lettuce','Carrots','Green Beans','Peppers','Bell Peppers','Squash','Basil','Corn','Onions','Garlic','Potatoes','Beets','Chard','Spinach','Broccoli','Cauliflower','Cabbage','Eggplant','Cherries','Figs','Plums','Apples','Pears','Grapes','Melon','Watermelon','Cantaloupe','Pumpkin','Rhubarb','Gooseberries','Currants','Leeks','Celery','Fennel','Turnips','Parsnips','Okra','Cilantro','Parsley','Mint','Sweet Potatoes'];

  RAW = `03-10|Asparagus|18|
03-12|Mushrooms|8|
04-07|Asparagus|31|

06-01|Strawberries|1.5|

06-28|Strawberries|3.6|`;

  seed(n){ const x=Math.sin(n*127.1+311.7)*43758.5; return x-Math.floor(x); }
  parseBase(){ return this.RAW.trim().split('\n').map(l=>{ const [md,crop,oz,note]=l.split('|'); return {crop,oz:parseFloat(oz),md,note:note||''}; }); }
  gen(base,year,scale,drop){
    const out=[];
    base.forEach((e,i)=>{
      if(this.seed(i*2.3+year)<drop) return;
      const oz=Math.max(0.3, Math.round(e.oz*scale*(0.75+this.seed(i*3.7+year)*0.55)*10)/10);
      const shift=Math.floor(this.seed(i*5.1+year)*7)-3;
      const d=new Date(year+'-'+e.md+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+shift);
      out.push({crop:e.crop, oz, date:d.toISOString().slice(0,10), note:''});
    });
    return out;
  }
  buildAll(){
    const base=this.parseBase();
    const y2026=base.map(e=>({crop:e.crop, oz:e.oz, date:'2026-'+e.md, note:e.note}));
    this.LAST_YEAR_ENTRIES = this.gen(base,2025,0.84,0.18);
    return [].concat(this.gen(base,2024,0.62,0.32), this.LAST_YEAR_ENTRIES, y2026);
  }
  ALL = this.buildAll();
  LAST_YEAR = Math.round(this.LAST_YEAR_ENTRIES.reduce((a,e)=>a+e.oz,0));

  newDraft(){ return { oz:'', note:'', dayOff:0, date:'2026-07-03', photo:false, variant:null }; }
  state = { app: { screen:'home', entries:this.ALL, quick:[...this.QUICK], sel:null, draft:this.newDraft(), toast:null, addName:'', addToQuick:true, logYear:2026, logCrop:null, expandedMonths:{'2026-6':true}, cropSheet:false } };
  timer = null;

  fmt(n){ n=Math.round(n*10)/10; return (n%1===0)? String(n): n.toFixed(1); }
  shiftDate(off){ const b=new Date(2026,6,3); b.setDate(b.getDate()-off); const m=String(b.getMonth()+1).padStart(2,'0'); const d=String(b.getDate()).padStart(2,'0'); return b.getFullYear()+'-'+m+'-'+d; }
  updApp(patch){ this.setState(p=>({ app:{...p.app, ...patch} })); }
  updDraft(patch){ this.setState(p=>({ app:{...p.app, draft:{...p.app.draft, ...patch}} })); }
  pingToast(){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.updApp({toast:null}),2400); }

  theme(){ return { name:'Garden', dark:false, grid:true, radius:24, tileRadius:22, panel:'linear-gradient(180deg,#f0f8e8,#e2f2d3)', card:'#ffffff', ink:'#22381c', sub:'#6a8560', line:'rgba(34,56,28,.10)', accent:'#ff6a4d', accentInk:'#ffffff', accent2:'#4caf50', statusInk:'#22381c', font:'"Nunito Sans", sans-serif', head:'"DM Serif Display", serif', mono:'"DM Mono", monospace' }; }

  renderVals(){
    const h = {
      onSelect:(name)=>this.updApp({screen:'entry', sel:name, draft:this.newDraft()}),
      onNav:(scr)=>this.updApp({screen:scr}),
      onKey:(k)=>{ const cur=String(this.state.app.draft.oz||''); let v; if(k==='del') v=cur.slice(0,-1); else if(k==='.') v=cur.includes('.')?cur:((cur||'0')+'.'); else v=cur+k; if(v.replace('.','').length>5) v=cur; this.updDraft({oz:v}); },
      onBump:(d)=>{ const cur=parseFloat(this.state.app.draft.oz)||0; const v=Math.max(0,Math.round((cur+d)*10)/10); this.updDraft({oz: v===0?'':String(v)}); },
      onNote:(v)=>this.updDraft({note:v}),
      onDate:(off)=>this.updDraft({dayOff:off, date:this.shiftDate(off)}),
      onPhoto:(p)=>this.updDraft({photo: p||null}),
      onVariant:(v)=>this.updDraft({variant: this.state.app.draft.variant===v? null : v}),
      onSave:()=>{ const a=this.state.app; const oz=parseFloat(a.draft.oz)||0; if(oz<=0) return; const note=[a.draft.variant,a.draft.note].filter(Boolean).join(' · '); const entry={crop:a.sel,oz,date:a.draft.date,note,photo:a.draft.photo}; this.updApp({entries:[...a.entries,entry], screen:'home', sel:null, draft:this.newDraft(), toast:'🌱 Logged '+this.fmt(oz)+' oz '+a.sel}); this.pingToast(); },
      onBack:()=>this.updApp({screen:'home'}),
      onStartAdd:()=>this.updApp({screen:'add', addName:'', addToQuick:true}),
      onAddName:(v)=>this.updApp({addName:v}),
      onPickSuggest:(n)=>this.updApp({addName:n}),
      onToggleQuick:()=>this.updApp({addToQuick: this.state.app.addToQuick===false}),
      onCommitAdd:()=>{ const a=this.state.app; let name=(a.addName||'').trim(); if(!name) return; const hit=this.MASTER.find(m=>m.toLowerCase()===name.toLowerCase()); if(hit) name=hit; let quick=a.quick; if(a.addToQuick!==false && !quick.includes(name)) quick=[...quick,name]; this.updApp({quick, screen:'entry', sel:name, addName:'', draft:this.newDraft()}); },
      onShare:()=>{ this.updApp({toast:'✨ Harvest card ready to share'}); this.pingToast(); },
      onLogYear:(y)=>this.updApp({logYear:y}),
      onLogCrop:(name)=>this.updApp({logCrop:name, cropSheet:false}),
      onOpenCropSheet:()=>this.updApp({cropSheet:true}),
      onCloseCropSheet:()=>this.updApp({cropSheet:false}),
      onToggleMonth:(key)=>this.setState(p=>{ const em={...(p.app.expandedMonths||{})}; em[key]=!em[key]; return { app:{...p.app, expandedMonths:em} }; })
    };
    return { app:this.state.app, theme:this.theme(), colors:this.COLORS, variants:this.VARIANTS, master:this.MASTER, season:2026, lastYearTotal:this.LAST_YEAR, h };
  }
}
</script>
</body>
</html>
